name: Release
on:
  push:
    tags: ['**']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run tests
        run: |
          # A venv outside the checkout, so nothing extra gets packaged. The tests
          # run with -I, which ignores the user site-packages pip would use otherwise.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install lupa
          "$RUNNER_TEMP/venv/bin/python" -I tests/run_tests.py
      - uses: BigWigsMods/packager@v2