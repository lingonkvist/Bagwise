name: Release
on:
  push:
    tags: ['**']

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run tests
        run: |
          pip install lupa
          python3 -I tests/run_tests.py
      - uses: BigWigsMods/packager@v2