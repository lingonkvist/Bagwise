name: Checks
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install lupa
          "$RUNNER_TEMP/venv/bin/python" -I tests/run_tests.py
      - name: Tool self-tests
        run: |
          python3 -I tools/build_auction_prices.py --selftest
          python3 -I tools/build_reagent_professions.py --selftest
          python3 -I tools/audit_trade_goods.py --selftest
          python3 -I tools/build_library_books.py --selftest
          python3 -I tools/build_quest_availability.py --selftest
      - name: Globals (typos and missing locals)
        run: |
          npm install --prefix "$RUNNER_TEMP/lp" luaparse@0.3.1
          NODE_PATH="$RUNNER_TEMP/lp/node_modules" node tools/check_globals.js
